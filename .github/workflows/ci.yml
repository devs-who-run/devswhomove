name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build Angular
        run: pnpm run build
      - name: Typecheck Worker
        run: pnpm run typecheck:worker
      - name: Test Angular
        run: pnpm test
      - name: Test Worker and D1 integration
        run: pnpm run test:worker
      - name: Validate Cloudflare bundle without deploying
        run: pnpm exec wrangler deploy --dry-run

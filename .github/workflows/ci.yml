name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Build Angular
        run: npm run build
      - name: Typecheck Worker
        run: npm run typecheck:worker
      - name: Test Angular
        run: npm test
      - name: Test Worker and D1 integration
        run: npm run test:worker
      - name: Validate Cloudflare bundle without deploying
        run: npx wrangler deploy --dry-run
